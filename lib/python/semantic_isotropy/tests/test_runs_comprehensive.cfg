# Comprehensive Test Configuration for Metric Runner
# This configuration tests various device allocation scenarios and job patterns
#
root_directory: "/tmp/metric_runner_tests"
code_directory: "/tmp/git/semantic_isotropy"
script_path: "{{code_dir}}/lib/python/longform_uq/tests/mock_job.py"
output_path_template: "{{root_dir}}/results/{{metric}}_{{model_suffix}}_{{response_count}}.json"
logging_directory: "{{root_dir}}/logs"

# Hardware configuration for testing
available_gpus: 4  # Test with 4 GPUs: 0, 1, 2, 3
dryrun: false

runs:
  # Test Run 1: Basic CUDA allocation test - Mixed GPU requirements
  - input_path: "{{root_dir}}/data/sample_input_1.json"
    metric: "isotropy"
    embedding_model:
      # Mix of single-GPU and all-GPU jobs
      - ["test/model-small-1", "mean", "small_model_1"]
      - ["test/model-small-2", "last", "small_model_2"]
      - ["test/model-medium-1", "mean", "medium_model_1"]
      - ["test/model-large-1", "last", "large_model_1"]  # This will need all GPUs
    response_count:
      - 100
      - 250
      - 500
    response_max: 1000
    min_runtime: 3.0    # Faster for testing
    max_runtime: 12.0   # Reasonable test duration
    failure_rate: 0.02  # Low failure rate for testing

    # Device configuration with overrides
    devices:
      default:
        type: "cuda"
        count: 1
      overrides:
        # Large model needs all GPUs
        - condition:
            embedding_model: "test/model-large-1"
          value:
            type: "cuda"
            count: "all"

  # Test Run 2: CPU-only processing test
  - input_path: "{{root_dir}}/data/sample_input_2.json"
    metric: "luq_score"
    embedding_model:
      - ["test/cpu-model-1", "mean", "cpu_model_1"]
      - ["test/cpu-model-2", "last", "cpu_model_2"]
    response_count:
      - 50
      - 100
      - 200
    response_max: 500
    min_runtime: 2.0
    max_runtime: 8.0
    failure_rate: 0.01

    devices:
      default:
        type: "cpu"
        max_concurrency: 3

  # Test Run 3: MPS (Apple Silicon) test
  - input_path: "{{root_dir}}/data/sample_input_3.json"
    metric: "entailment"
    embedding_model:
      - ["test/mps-model-1", "mean", "mps_model_1"]
      - ["test/mps-model-2", "last", "mps_model_2"]
    response_count:
      - 75
      - 150
    response_max: 300
    min_runtime: 4.0
    max_runtime: 10.0
    failure_rate: 0.0   # No failures for MPS test

    devices:
      default:
        type: "mps"

  # Test Run 4: Mixed device types and complex priority scenarios
  - input_path: "{{root_dir}}/data/sample_input_4.json"
    metric: "isotropy"
    embedding_model:
      - ["test/priority-model-1", "mean", "priority_model_1"]
      - ["test/priority-model-2", "last", "priority_model_2"]
      - ["test/priority-model-large", "mean", "priority_large"]
    response_count:
      - 100
      - 300
      - 600
    response_max: 1000
    min_runtime: 5.0
    max_runtime: 15.0
    failure_rate: 0.03

    devices:
      default:
        type: "cuda"
        count: 1
      overrides:
        # Test priority system: all-GPU job should run last
        - condition:
            embedding_model: "test/priority-model-large"
            response_count: 600
          value:
            type: "cuda"
            count: "all"

  # Test Run 5: Stress test - Many small jobs
  - input_path: "{{root_dir}}/data/sample_input_5.json"
    metric: "luq_score"
    embedding_model:
      - ["test/stress-model-1", "mean", "stress_1"]
      - ["test/stress-model-2", "last", "stress_2"]
      - ["test/stress-model-3", "mean", "stress_3"]
      - ["test/stress-model-4", "last", "stress_4"]
      - ["test/stress-model-5", "mean", "stress_5"]
    response_count:
      - 25
      - 50
      - 75
      - 100
    response_max: 200
    min_runtime: 1.0
    max_runtime: 5.0
    failure_rate: 0.05  # Higher failure rate for stress testing

    devices:
      default:
        type: "cuda"
        count: 1

# Test Configuration Comments:
#
# This configuration creates approximately 51 test jobs across different scenarios:
# - Run 1: 4 models × 3 response_counts = 12 jobs (mix of 1-GPU and all-GPU)
# - Run 2: 2 models × 3 response_counts = 6 jobs (CPU with concurrency=3)
# - Run 3: 2 models × 2 response_counts = 4 jobs (MPS sequential)
# - Run 4: 3 models × 3 response_counts = 9 jobs (priority testing)
# - Run 5: 5 models × 4 response_counts = 20 jobs (stress test with many small jobs)
#
# Total: ~51 jobs testing different allocation patterns, priorities, and device types
#
# Expected behaviors to test:
# 1. Single-GPU jobs should run in parallel up to GPU limit
# 2. All-GPU jobs should run only when all GPUs are free
# 3. CPU jobs should respect concurrency limits
# 4. MPS jobs should run sequentially
# 5. Priority system should work (1-GPU > all-GPU)
# 6. Job failures should be handled gracefully
# 7. Logging should work correctly for all scenarios
