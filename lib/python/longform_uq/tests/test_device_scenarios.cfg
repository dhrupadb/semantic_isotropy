# Device-Specific Test Scenarios
# Tests different device types and edge cases for metric runner
#
root_directory: "/tmp/metric_runner_device_tests"
code_directory: "/tmp/git/semantic_isotropy"
script_path: "{{code_dir}}/lib/python/longform_uq/tests/mock_job.py"
output_path_template: "{{root_dir}}/results/{{metric}}_{{model_suffix}}_{{response_count}}.json"
logging_directory: "{{root_dir}}/logs"
available_gpus: 2  # Limited GPU test
dryrun: false

runs:
  # Scenario 1: GPU Resource Contention Test
  - input_path: "{{root_dir}}/data/gpu_contention.json"
    metric: "gpu_stress"
    embedding_model:
      # Mix of single-GPU jobs to test queueing
      - ["contention/model-1", "mean", "gpu_1"]
      - ["contention/model-2", "last", "gpu_2"]
      - ["contention/model-3", "mean", "gpu_3"]
      - ["contention/model-4", "last", "gpu_4"]
    response_count:
      - 100
    response_max: 200
    min_runtime: 8.0   # Longer runtime to test concurrent execution
    max_runtime: 15.0
    failure_rate: 0.0  # No failures for resource testing

    devices:
      default:
        type: "cuda"
        count: 1

  # Scenario 2: Priority Test (1-GPU vs All-GPU)
  - input_path: "{{root_dir}}/data/priority_test.json"
    metric: "priority"
    embedding_model:
      - ["priority/small-1", "mean", "small_1"]      # 1 GPU - high priority
      - ["priority/small-2", "last", "small_2"]      # 1 GPU - high priority
      - ["priority/large", "mean", "large_model"]    # All GPUs - low priority
      - ["priority/small-3", "mean", "small_3"]      # 1 GPU - high priority
    response_count:
      - 150
    response_max: 300
    min_runtime: 6.0
    max_runtime: 12.0
    failure_rate: 0.0

    devices:
      default:
        type: "cuda"
        count: 1
      overrides:
        - condition:
            embedding_model: "priority/large"
          value:
            type: "cuda"
            count: "all"

  # Scenario 3: CPU Concurrency Test
  - input_path: "{{root_dir}}/data/cpu_test.json"
    metric: "cpu_load"
    embedding_model:
      - ["cpu/model-1", "mean", "cpu_1"]
      - ["cpu/model-2", "last", "cpu_2"]
      - ["cpu/model-3", "mean", "cpu_3"]
      - ["cpu/model-4", "last", "cpu_4"]
      - ["cpu/model-5", "mean", "cpu_5"]
    response_count:
      - 75
    response_max: 150
    min_runtime: 4.0
    max_runtime: 8.0
    failure_rate: 0.0

    devices:
      default:
        type: "cpu"
        max_concurrency: 3  # Test with 3 concurrent CPU jobs

  # Scenario 4: MPS Sequential Test
  - input_path: "{{root_dir}}/data/mps_test.json"
    metric: "mps_sequential"
    embedding_model:
      - ["mps/model-1", "mean", "mps_1"]
      - ["mps/model-2", "last", "mps_2"]
      - ["mps/model-3", "mean", "mps_3"]
    response_count:
      - 100
    response_max: 200
    min_runtime: 3.0
    max_runtime: 7.0
    failure_rate: 0.0

    devices:
      default:
        type: "mps"  # Should run strictly sequential

  # Scenario 5: Failure Handling Test
  - input_path: "{{root_dir}}/data/failure_test.json"
    metric: "failure_resilience"
    embedding_model:
      - ["failure/unstable-1", "mean", "unstable_1"]
      - ["failure/stable-1", "last", "stable_1"]
      - ["failure/unstable-2", "mean", "unstable_2"]
      - ["failure/stable-2", "last", "stable_2"]
    response_count:
      - 50
    response_max: 100
    min_runtime: 2.0
    max_runtime: 6.0
    failure_rate: 0.3  # 30% failure rate to test error handling

    devices:
      default:
        type: "cuda"
        count: 1

  # Scenario 6: Mixed Device Types Test
  - input_path: "{{root_dir}}/data/mixed_devices.json"
    metric: "mixed_test"
    embedding_model:
      - ["mixed/cuda-model", "mean", "cuda_mixed"]
      - ["mixed/cpu-model", "last", "cpu_mixed"]
    response_count:
      - 50
      - 100
    response_max: 200
    min_runtime: 3.0
    max_runtime: 8.0
    failure_rate: 0.05

    # Test override to different device types
    devices:
      default:
        type: "cuda"
        count: 1
      overrides:
        - condition:
            embedding_model: "mixed/cpu-model"
          value:
            type: "cpu"
            max_concurrency: 2
